name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: pip install -r requirements.lock
      - name: Tests (LLM mocked; real-data eval tests skip without the dataset)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (dataset is ingested on first container start)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: restaurant-recommender:ci
          build-args: INGEST_AT_BUILD=0
