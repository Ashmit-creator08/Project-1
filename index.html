<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="login-card">
      <h1 class="title">Login</h1>

      <form class="login-form" action="#" method="post">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <i class="fa-regular fa-user" aria-hidden="true"></i>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Type your username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Type your password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <a class="forgot" href="#">Forgot password?</a>

        <button class="login-btn" type="submit">LOGIN</button>
      </form>

      <p class="divider">Or Sign Up Using</p>

      <div class="socials">
        <a class="social facebook" href="#" aria-label="Sign up with Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a class="social twitter" href="#" aria-label="Sign up with Twitter">
          <i class="fa-brands fa-twitter"></i>
        </a>
        <a class="social google" href="#" aria-label="Sign up with Google">
          <i class="fa-brands fa-google"></i>
        </a>
      </div>

      <div class="signup">
        <p>Or Sign Up Using</p>
        <a href="#">SIGN UP</a>
      </div>
    </div>
  </div>
</body>
</html>
