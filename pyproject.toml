[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recommender"
version = "1.0.0"
description = "AI-powered restaurant recommendation service (Zomato use case, Groq LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "datasets>=3.0.0",
  "pyarrow>=17.0.0",
  "httpx>=0.27.0",
  "openai>=1.54.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
restaurant-recommender-ingest = "restaurant_recommender.data.ingest:main"
restaurant-recommender-eval = "restaurant_recommender.eval.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
